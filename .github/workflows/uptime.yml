name: Uptime

# Checks the live pilot and development sites every 3 hours (NFR 18: 95%
# availability). It runs the same read-only checks as "npm run smoke:pilot"
# and "npm run smoke:dev": they never sign in,
# never writes and needs no keys. A failed run emails the repo owner, and the
# run history under Actions > Uptime is the availability record.
#
# GitHub only runs scheduled workflows from the default branch (main), and
# pauses them after 60 days with no activity in the repo.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The checks use only what comes with Node, so no "npm ci" is needed.
      - name: Pilot site
        run: npm run smoke:pilot

      # Runs even if the pilot check failed, so each site gets its own result.
      - name: Development site
        if: always()
        run: npm run smoke:dev
