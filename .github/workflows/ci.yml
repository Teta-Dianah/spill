name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - run: npm run lint

      # Runs the test suite against a local, fake Firebase project
      # ("demo-" prefix) so CI never needs real project credentials.
      - run: npx firebase emulators:exec --project demo-spill-dev "npm test"
