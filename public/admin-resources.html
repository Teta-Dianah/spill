<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage resources — Spill</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Manage resources</h1>
    <p>Admin only. Add, check or remove helplines and clinics.</p>
  </header>

  <main>
    <form id="add-resource-form" class="card">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="contact">Contact (phone number or address)</label>
      <input type="text" id="contact" name="contact" required>

      <label for="category">Category</label>
      <select id="category" name="category">
        <option value="helpline">Helpline</option>
        <option value="clinic">Clinic</option>
      </select>

      <label for="lastVerified">Last verified date</label>
      <input type="date" id="lastVerified" name="lastVerified" required>

      <button type="submit">Add resource</button>
      <p id="admin-message" class="message"></p>
    </form>

    <section class="card">
      <h2>Current resources</h2>
      <ul id="admin-resources-list" class="plain-list"></ul>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/admin-resources.js"></script>
  <script src="js/crisis-card.js"></script>
</body>
</html>
