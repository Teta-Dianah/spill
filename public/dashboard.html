<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Spill</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="wide">
  <header>
    <div class="topbar">
      <a class="brand" href="dashboard.html">Spill</a>
      <button type="button" id="sign-out-button">Sign out</button>
    </div>
    <p class="eyebrow">You are known here as</p>
    <h1 id="pseudonym-display">&nbsp;</h1>
  </header>

  <main>
    <div class="columns">
      <section class="card">
        <h2>How's today going?</h2>
        <form id="mood-form">
          <fieldset>
            <legend class="visually-hidden">Mood from 1 to 5</legend>
            <div class="choices choices-scale">
          <label class="choice"><input type="radio" name="score" value="1" required aria-describedby="score-ends"><span>1</span></label>
          <label class="choice"><input type="radio" name="score" value="2"><span>2</span></label>
          <label class="choice"><input type="radio" name="score" value="3"><span>3</span></label>
          <label class="choice"><input type="radio" name="score" value="4"><span>4</span></label>
          <label class="choice"><input type="radio" name="score" value="5"><span>5</span></label>
        </div>
        <p class="scale-ends" id="score-ends"><span>1 is rough</span><span>5 is great</span></p>
          </fieldset>

          <label for="note">Anything to add? (optional)</label>
          <textarea id="note" name="note" rows="2" maxlength="280"></textarea>

          <button type="submit">Save check-in</button>
          <p id="mood-message" class="message"></p>
        </form>
      </section>

      <div>
        <section class="card card-dark">
          <h2>Need to talk?</h2>
          <p>A trained listener can chat with you one-to-one.</p>
          <a class="button button-accent" href="request-chat.html">Talk to a listener</a>
        </section>

        <section class="card">
          <h2>Your check-ins</h2>
          <p id="monthly-recap" class="hint"></p>
          <ul id="mood-history" class="plain-list">
            <li>Loading...</li>
          </ul>
        </section>

        <section class="card" id="staff-links-section" hidden>
          <h2>Your Spill pages</h2>
          <ul id="staff-links" class="plain-list"></ul>
        </section>
      </div>
    </div>

    <div class="actions">
      <a href="listener-apply.html">Apply to be a listener</a>
      <button type="button" id="delete-account-button" class="button-danger-link">Delete my account</button>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/mood-validate.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/staff-links.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/crisis-card.js"></script>
</body>
</html>
