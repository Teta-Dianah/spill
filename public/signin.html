<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Spill</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="topbar">
      <a class="brand" href="index.html">Spill</a>
      <a href="signup.html">Sign up</a>
    </div>
    <h1>Welcome back.</h1>
    <p>Pick up where you left off.</p>
  </header>

  <main>
    <form id="signin-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
      <p id="signin-message" class="message"></p>
    </form>

    <p class="fine-print">New here? <a href="signup.html">Get a made-up name</a></p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/signin.js"></script>
  <script src="js/crisis-card.js"></script>
</body>
</html>
